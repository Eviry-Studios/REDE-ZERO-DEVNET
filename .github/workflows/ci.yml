name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain fixada (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatação
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Testes
        run: cargo test --workspace --locked
      - name: Vetores publicados
        run: cargo run --locked -p rz-crypto --example vectors
      - name: Suíte de conformidade (SPEC §68–69)
        run: cargo run --locked -p rz-conformance --bin zero-conformidade -- verificar conformance

  reproducible:
    name: build reproduzível
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain fixada (rust-toolchain.toml)
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
      - name: Dois builds em diretórios diferentes
        env:
          RUSTFLAGS: ""
        run: |
          cp -a "$GITHUB_WORKSPACE" /tmp/outro-caminho
          scripts/build-reproduzivel.sh /tmp/saida-a
          /tmp/outro-caminho/scripts/build-reproduzivel.sh /tmp/saida-b
      - name: Binários idênticos byte a byte (REQ-004, THR-DEV-003)
        run: |
          diff /tmp/saida-a/artefatos.txt /tmp/saida-b/artefatos.txt
          cat /tmp/saida-a/artefatos.txt >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: varredura de chaves no repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nenhum arquivo de chave versionado (THR-DEV-007)
        run: |
          if git ls-files | grep -E '\.(key|secret)$|(^|/)devnet-data/'; then
            echo "::error::arquivos de chave ou dados de DEVNET versionados"
            exit 1
          fi
